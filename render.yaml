services:
  # Backend API Server & BullMQ Worker
  - type: web
    name: reachinbox-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_SEND_DELAY_MS
        value: 1000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 10

  # Frontend React Dashboard
  - type: web
    name: reachinbox-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url

databases:
  - name: reachinbox-postgres
    databaseName: scheduler
    user: scheduler
    region: oregon
    plan: free

# Managed Redis instance on Render
  - type: redis
    name: reachinbox-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
